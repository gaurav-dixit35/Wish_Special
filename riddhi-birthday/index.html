  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/chapters.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/memories.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/vouchers.css">
  <link rel="stylesheet" href="css/eggs.css">
  <link rel="stylesheet" href="css/voice.css">
  <link rel="stylesheet" href="css/letter.css">
  <link rel="stylesheet" href="css/finale.css">
  <link rel="stylesheet" href="css/happiness.css">
  <link rel="stylesheet" href="css/animations.css">
  <link id="font-css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all';this.dataset.ready='true'" onerror="this.dataset.ready='error'">
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="sky-wash" aria-hidden="true"></div>
  <canvas id="aurora" aria-hidden="true"></canvas>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="sky-vignette" aria-hidden="true"></div>
  <button id="egg-moon" class="sky-secret" type="button" data-egg="moon" hidden></button>
  <button id="egg-star" class="sky-secret" type="button" data-egg="star" hidden></button>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M10 21c0-3 3-8 6-8s6 5 6 8c0 4-4 3-6 3s-6 1-6-3Z"/><ellipse cx="6.5" cy="13" rx="3" ry="4" transform="rotate(-25 6.5 13)"/><ellipse cx="13" cy="7.5" rx="3" ry="4"/><ellipse cx="21" cy="7.5" rx="3" ry="4"/><ellipse cx="27" cy="14" rx="3" ry="4" transform="rotate(25 27 14)"/></svg></span>
        <button class="egg-name" type="button" data-egg="name"><span data-copy="ui.brand"></span></button>
      </div>
      <div class="header-right">
        <span class="header-date" data-copy="ui.date"></span>
        <button id="sound-toggle" class="sound-button" type="button" aria-pressed="false">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="sound-label"></span>
        </button>
      </div>
    </header>
    <main id="stage" tabindex="-1"></main>
    <footer class="site-footer"><span class="footer-line" aria-hidden="true"></span><span data-copy="ui.footer"></span><button id="egg-footer-heart" class="footer-heart" type="button" data-egg="heart"><span aria-hidden="true">♡</span></button></footer>
  </div>
  <div id="hud" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="preview-badge" hidden></div>
</body>
</html>
